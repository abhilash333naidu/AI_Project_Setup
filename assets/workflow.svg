<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">AI Project Setup workflow</title><desc id="desc">Six stages: define, design, readiness review, execute, verify, and learn. Human review is shown at the readiness gate. The cycle repeats through controlled changes.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#0B2038"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1D6FE8"/><stop offset="1" stop-color="#17469D"/></linearGradient>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0EAFA4"/><stop offset="1" stop-color="#087A83"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7658D8"/><stop offset="1" stop-color="#493A9B"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity=".35"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#5FA8DD"/></marker>
 <style>.h{font:700 28px Inter,Segoe UI,Arial,sans-serif;fill:#F3F8FF}.sub{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#B7CBE0}.step{font:700 13px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.7px;fill:#A9C8E8}.body{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#D6E5F4}.tag{font:600 13px Inter,Segoe UI,Arial,sans-serif;fill:#C5DDF3}</style>
</defs>
<rect width="1440" height="760" rx="28" fill="url(#bg)"/>
<circle cx="1220" cy="100" r="220" fill="#143B63" opacity=".13"/><circle cx="120" cy="680" r="240" fill="#075D70" opacity=".10"/>
<text x="76" y="78" class="step">THE OPERATING LIFECYCLE</text><text x="76" y="124" class="h">From project intent to verified change</text><text x="76" y="158" class="sub">A documentation-led workflow with explicit review, execution and evidence stages.</text>
<!-- arrows row 1 -->
<g fill="none" stroke="#5FA8DD" stroke-width="3" marker-end="url(#arrow)"><path d="M430 290H500"/><path d="M855 290H925"/><path d="M1135 390V470H1135V500"/><path d="M925 590H855"/><path d="M500 590H430"/></g>
<!-- cards -->
<g filter="url(#shadow)">
 <rect x="76" y="210" width="354" height="180" rx="20" fill="#102A49" stroke="#2D6EC0" stroke-width="2"/>
 <rect x="500" y="210" width="355" height="180" rx="20" fill="#102A49" stroke="#2D6EC0" stroke-width="2"/>
 <rect x="925" y="210" width="354" height="180" rx="20" fill="#123B42" stroke="#25B9B0" stroke-width="2"/>
 <rect x="925" y="500" width="354" height="180" rx="20" fill="#102A49" stroke="#2D6EC0" stroke-width="2"/>
 <rect x="500" y="500" width="355" height="180" rx="20" fill="#102A49" stroke="#2D6EC0" stroke-width="2"/>
 <rect x="76" y="500" width="354" height="180" rx="20" fill="#292449" stroke="#8B73E8" stroke-width="2"/>
</g>
<g>
 <text x="106" y="252" class="step">01 · DEFINE</text><text x="106" y="295" class="h">Project intent</text><text x="106" y="329" class="body">Problem · outcomes · scope</text><text x="106" y="356" class="body">Requirements · constraints</text>
 <text x="530" y="252" class="step">02 · DESIGN</text><text x="530" y="295" class="h">Solution definition</text><text x="530" y="329" class="body">Architecture · experience</text><text x="530" y="356" class="body">Technical decisions · standards</text>
 <text x="955" y="252" class="step">03 · READINESS GATE</text><text x="955" y="295" class="h">Review and authorise</text><text x="955" y="329" class="body">Check required documents</text><text x="955" y="356" class="body">Resolve gaps · human review</text>
 <text x="955" y="542" class="step">04 · EXECUTE</text><text x="955" y="585" class="h">Controlled implementation</text><text x="955" y="619" class="body">Work from approved tasks</text><text x="955" y="646" class="body">Record changes and decisions</text>
 <text x="530" y="542" class="step">05 · VERIFY</text><text x="530" y="585" class="h">Demonstrate outcomes</text><text x="530" y="619" class="body">Run acceptance checks</text><text x="530" y="646" class="body">Retain actual evidence</text>
 <text x="106" y="542" class="step">06 · LEARN</text><text x="106" y="585" class="h">Maintain continuity</text><text x="106" y="619" class="body">Update project state</text><text x="106" y="646" class="body">Capture lessons and open issues</text>
</g>
<path d="M250 690V720H1135V690" fill="none" stroke="#8B73E8" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<text x="720" y="744" text-anchor="middle" class="tag">Controlled change starts the next iteration · adapt gates to project risk</text>
</svg>
